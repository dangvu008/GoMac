name: 🐛 Báo lỗi
description: Báo cáo lỗi phần mềm
labels: ["bug"]
body:
  - type: dropdown
    id: bug-type
    attributes:
      label: Loại lỗi
      options:
        - Gõ ra kết quả không như mong đợi
        - Khác
    validations:
      required: true

  - type: dropdown
    id: app-scope
    attributes:
      label: Lỗi xảy ra ở đâu?
      description: Lỗi chỉ xảy ra trên một app cố định hay tất cả các app?
      options:
        - Chỉ một app cố định
        - Một vài app nhất định
        - Tất cả các app
        - Không chắc chắn
    validations:
      required: true

  - type: input
    id: affected-apps
    attributes:
      label: App bị lỗi
      description: "⚠️ BẮT BUỘC nếu chọn 'Chỉ một app' hoặc 'Một vài app'. Ví dụ: Chrome, VS Code, Telegram..."
      placeholder: "Chrome, VS Code..."

  - type: textarea
    id: description
    attributes:
      label: Mô tả lỗi
      placeholder: Lỗi gì đã xảy ra? Gõ gì thì bị sai?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Các bước tái hiện
      placeholder: |
        1. Mở app X
        2. Gõ "abc"
        3. Kết quả bị sai thành "xyz"

  - type: dropdown
    id: input-method
    attributes:
      label: Kiểu gõ đang dùng
      options:
        - Telex
        - VNI
        - Không biết
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Hệ điều hành
      options:
        - macOS 15 (Sequoia)
        - macOS 14 (Sonoma)
        - macOS 13 (Ventura)
        - macOS 12 (Monterey)
        - Windows 11
        - Windows 10
        - Linux
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Phiên bản VKey
      description: Xem trong menu VKey > About
      placeholder: "1.0.64"

  - type: dropdown
    id: frequency
    attributes:
      label: Tần suất xảy ra
      options:
        - Luôn luôn (100%)
        - Thường xuyên (>50%)
        - Thỉnh thoảng (<50%)
        - Hiếm khi
        - Chỉ một lần

  - type: textarea
    id: debug-log
    attributes:
      label: Cung cấp debug log
      description: |
        1. Bật log: `touch /tmp/vkey_debug.log && tail -f /tmp/vkey_debug.log`
        2. Gõ lại từ/cụm từ bị lỗi, copy log paste vào ô dưới
        3. Xoá log: `rm -f /tmp/vkey_debug.log`
      placeholder: Paste debug log vào đây...